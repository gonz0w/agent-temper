name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch the proposed source
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "$SOURCE_URL"
          git fetch --no-tags --depth=1 origin "$SOURCE_REVISION"
          git checkout --detach FETCH_HEAD
      - name: Run local verification
        run: python3 tools/verify.py

